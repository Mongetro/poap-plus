<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="title2 desc2">
  <title id="title2">POAP+ Token</title>
  <desc id="desc2">Jeton hexagonal avec coche et plus.</desc>
  <!-- hexagone -->
  <polygon points="100,28 150,58 150,118 100,148 50,118 50,58" fill="#0B76FF" stroke="#023E8A" stroke-width="4"></polygon>
  <!-- contour intérieur -->
  <polygon points="100,44 136,68 136,108 100,132 64,108 64,68" fill="#ffffff" opacity="0.06"></polygon>
  <!-- coche -->
  <path d="M78 90 L94 106 L124 76" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
  <!-- petit + -->
  <rect x="139" y="38" width="34" height="34" rx="6" fill="#ffffff"></rect>
  <path d="M156 46 v18 M147 55 h18" stroke="#0B76FF" stroke-width="3" stroke-linecap="round"></path>
</svg>
